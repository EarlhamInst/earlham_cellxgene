user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    # Upstream servers
    upstream landing-page {
        server landing-page:8000;
    }

    # Note: CellXGene containers are spawned dynamically with names like cellxgene-{dataset_id}
    # They are proxied using regex location matching, not static upstreams

    # Main server block
    server {
        listen 80;
        server_name _;

        # Client max body size (for large uploads if needed)
        client_max_body_size 10G;

        # Landing page (root)
        location / {
            proxy_pass http://landing-page;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # API endpoints
        location /api/ {
            proxy_pass http://landing-page;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CORS headers
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
            
            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Dynamic CellXGene containers (pattern: /cellxgene-{dataset_id}/)
        # This uses regex to capture dataset_id and proxies to host port
        location ~ ^/cellxgene-([a-zA-Z0-9_-]+)/(.*)$ {
            # Extract dataset ID from URL
            set $dataset_id $1;
            set $path $2;
            
            # Proxy to Docker host port (containers are exposed on host)
            # The container manager allocates ports 5006-5100
            # We'll resolve the port dynamically using nginx variables
            # Note: This requires containers to be published to host ports
            resolver 127.0.0.11 valid=10s;  # Docker DNS
            
            # For now, we'll proxy to the Docker network directly
            # Each container is named cellxgene-{dataset_id}
            proxy_pass http://cellxgene-$dataset_id:5005/$path$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support (for CellXGene interactivity)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Longer timeouts for CellXGene (large datasets)
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            
            # Buffering settings for large responses
            proxy_buffering off;
            proxy_request_buffering off;
            
            # Handle errors when container is not available
            proxy_intercept_errors on;
            error_page 502 503 504 = @container_unavailable;
        }
        
        # Handler for when CellXGene container is unavailable
        location @container_unavailable {
            default_type text/html;
            return 200 '<!DOCTYPE html>
<html>
<head>
    <title>Container Closed</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f5f5;
        }
        .container {
            text-align: center;
            background: white;
            padding: 3rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 500px;
        }
        h1 {
            color: #C61F16;
            margin-bottom: 1rem;
        }
        p {
            color: #636e72;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .button {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: #C61F16;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            transition: background 0.3s;
        }
        .button:hover {
            background: #8d1510;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Session Closed</h1>
        <p>This CellXGene instance has been closed due to inactivity (48 hours). Click below to return to the landing page and relaunch the dataset.</p>
        <a href="/" class="button">Return to Landing Page</a>
    </div>
</body>
</html>';
        }

        # Static files (served by landing page, but can be cached here)
        location /static/ {
            proxy_pass http://landing-page;
            proxy_set_header Host $host;
            
            # Cache static files
            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        # Health check endpoint (for load balancer)
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
