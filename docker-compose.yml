
services:
  landing-page:
  
    build:
      context: ./services/landing-page
      dockerfile: Dockerfile
    container_name: cellxgene-landing-page
    environment:
      - DATA_DIRECTORY=/data/datasets
      - LOG_DIRECTORY=/tmp/logs
      - DEBUG=${LANDING_PAGE_DEBUG:-false}
      - LOG_LEVEL=${LANDING_PAGE_LOG_LEVEL:-INFO}
      - HOST_DATA_DIRECTORY=${HOST_DATA_DIRECTORY:-.}/data/datasets  # Host path for spawning containers
      - CELLXGENE_MEMORY_PER_WORKER_GB=${CELLXGENE_MEMORY_PER_WORKER_GB:-4}
    volumes:
      - ${HOST_DATA_DIRECTORY:-.}/data/datasets:/data/datasets:ro
      - ${HOST_LOG_DIRECTORY:-.}/data/logs:/data/logs:ro
      - /var/run/docker.sock:/var/run/docker.sock  # For dynamic container management
      
    ports:
      - "${LANDING_PAGE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      retries: 3
      #timeout: 10s
      start_period: 40s
      #disable: true
    networks:
      - cellxgene-network
    restart: unless-stopped

  # cellxgene service is now spawned dynamically by landing-page
  # Build the image for dynamic container spawning
  # This service builds the image but doesn't run as a persistent container
  # The landing-page service will spawn containers from this image on-demand
  cellxgene:
    build:
      context: ./services/cellxgene
      dockerfile: Dockerfile
    image: cellxgene_stack-cellxgene:latest
    # Use 'deploy' with replicas: 0 to build image without running service
    deploy:
      replicas: 0
    environment:
      - DATA_DIRECTORY=/data/datasets
      - WORKERS=2
      - TIMEOUT=${CELLXGENE_TIMEOUT_SECONDS:-300}
    volumes:
      - ${HOST_DATA_DIRECTORY:-.}/data/datasets:/data/datasets:ro   
    ports:
      - "${CELLXGENE_PORT:-5005}:5005"
    networks:
      - cellxgene-network

  nginx:
    build:
      context: ./services/nginx
      dockerfile: Dockerfile
    container_name: cellxgene-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      landing-page:
        condition: service_healthy
    volumes:
      - ./services/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - cellxgene-network
    restart: unless-stopped

networks:
  cellxgene-network:
    driver: bridge

volumes:
  datasets:
  logs:
